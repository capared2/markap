name: Inspeccionar pagina

# Utilidad de mantenimiento: vuelca la estructura de una noticia de Marca para
# poder ajustar los selectores del parser cuando cambien su maquetacion.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL de la noticia a inspeccionar"
        type: string
        required: true

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Inspeccionar
        run: python tools/inspect_page.py "${{ inputs.url }}" | tee tools/ultima-inspeccion.txt

      - name: Añadir al resumen
        if: always()
        run: |
          {
            echo '```'
            cat tools/ultima-inspeccion.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Deja el informe en el repositorio: asi queda a mano la maquetacion
      # vigente de Marca sin tener que abrir los logs de la ejecucion.
      - name: Guardar el informe en el repositorio
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ultima-inspeccion.txt
          if git diff --cached --quiet; then
            echo "El informe no ha cambiado."
            exit 0
          fi
          git commit -m "tools: informe de inspeccion de la maqueta de marca.com"
          for intento in 1 2 3; do
            if git push origin HEAD:${GITHUB_REF_NAME}; then exit 0; fi
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((2 ** intento))
          done
          exit 1
